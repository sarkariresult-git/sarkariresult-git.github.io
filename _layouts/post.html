---
layout: default
---
<div class="job-container">
  <h1>{{ page.title }}</h1>
  
  <div class="job-content">
    {{ content }}
  </div>
</div>

<!-- SEO: JobPosting Schema Automation ke liye -->
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "JobPosting",
  "title": "{{ page.title }}",
  "datePosted": "{{ page.date | date_to_xmlschema }}"
}
</script>
